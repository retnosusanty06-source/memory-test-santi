```html
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Test</title>

<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f5f7;
    margin:0;
    color:#111;
  }

  .card{
    max-width:520px;
    margin:40px auto;
    padding:28px;

    border-radius:20px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
  }

  h1{
    margin-top:0;
  }

  .sub{
    color:#666;
    line-height:1.5;
  }

  #display{
    font-size:36px;
    font-weight:700;
    min-height:90px;
    display:flex;
    align-items:center;

    margin:24px 0;
  }

  #progress{
    color:#666;
    margin:10px;
  }

  button{
    border:0;
    border-radius:12px;
    padding:14px 22px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    background:#111;
    color:#fff;
    margin:8px;
  }

  .option{
    display:block;
    width:90%;
    max-width:350px;
    margin:10px auto;
    background:#eee;

  }

  .option:hover{
    background:#ddd;
  }

  .hidden{
    display:none;
  }

  #message{
    font-size:18px;
    font-weight:600;
    min-height:28px;
    margin-top:10px;
  }
</style>
</head>

<body>

<div class="card">

  <h1>🧠 Memory Test</h1>

  <p class="sub">
    20 soal • 5 item per soal • setiap item tampil 3 detik
  </p>

  <div id="progress"></div>

  <div id="display">
    Siap latihan? 😏
  </div>

  <div id="startArea">
    <button onclick="startTest()">Mulai</button>
  </div>

  <div id="answerArea" class="hidden">

    <p id="question"></p>

    <div id="options"></div>

  </div>

  <div id="message"></div>

</div>

<script>

const categories = {

  "Hewan": [
    "Bebek","Ayam","Kucing","Kelinci","Kuda",
    "Gajah","Ikan","Harimau","Sapi","Kambing",
    "Monyet","Jerapah","Zebra","Panda","Singa"
  ],

  "Negara": [
    "Indonesia","Jepang","Brasil","Kanada","India",
    "Thailand","Korea","Mesir","Belanda","Italia",
    "Spanyol","Jerman","Meksiko","Argentina","Malaysia"
  ],

  "Buah": [
    "Mangga","Jeruk","Pisang","Apel","Semangka",
    "Melon","Pepaya","Durian","Rambutan","Anggur",
    "Alpukat","Nanas","Jambu","Salak","Stroberi"
  ],

  "Benda": [
    "Buku","Pensil","Gelas","Tas","Kamera",
    "Payung","Jam","Kursi","Meja","Lampu",
    "Cermin","Piring","Kunci","Dompet","Botol"
  ],

  "Kendaraan": [
    "Motor","Mobil","Bus","Kereta","Pesawat",
    "Kapal","Sepeda","Truk","Taksi","Becak",
    "Helikopter","Perahu","Minibus","Skuter","Truk"
  ],

  "Makanan": [
    "Roti","Nasi","Sate","Bakso","Soto",
    "Mie","Pizza","Burger","Rendang","Sup",
    "Tempe","Tahu","Martabak","Donat","Bubur"
  ]

};

let round = 0;
let score = 0;
let currentItems = [];
let askedItem = null;
let currentCategory = "";


function shuffle(array){
  return [...array].sort(() => Math.random() - 0.5);
}


function makeRound(){

  const categoryNames = Object.keys(categories);

  currentCategory =
    categoryNames[Math.floor(Math.random() * categoryNames.length)];

  const selectedWords =
    shuffle(categories[currentCategory]).slice(0,5);

  const numbers =
    shuffle(Array.from(
      {length:90},
      (_,i) => i + 10
    )).slice(0,5);

  currentItems = selectedWords.map((word,i) => ({
    word:word,
    number:numbers[i]
  }));

  askedItem =
    currentItems[
      Math.floor(Math.random() * currentItems.length)
    ];
}


function startTest(){

  round = 0;
  score = 0;

  document
    .getElementById("startArea")
    .classList.add("hidden");

  document
    .getElementById("message")
    .textContent = "";

  nextRound();
}


function nextRound(){

  if(round >= 20){

    document
      .getElementById("display")
      .textContent =
      `Selesai! Nilai kamu: ${score}/20 🎉`;

    document
      .getElementById("progress")
      .textContent = "";

    document
      .getElementById("answerArea")
      .classList.add("hidden");

    document
      .getElementById("startArea")
      .classList.remove("hidden");

    document
      .querySelector("#startArea button")
      .textContent =
      "Ulangi dengan soal baru";

    return;
  }

  round++;

  makeRound();

  document
    .getElementById("progress")
    .textContent =
    `Soal ${round} dari 20`;

  document
    .getElementById("answerArea")
    .classList.add("hidden");

  document
    .getElementById("message")
    .textContent = "";

  showItems(0);
}


function showItems(index){

  if(index < currentItems.length){

    const item = currentItems[index];

    document
      .getElementById("display")
      .textContent =
      `${item.number} ${item.word}`;

    setTimeout(
      () => showItems(index + 1),
      3000
    );

  }else{

    showQuestion();

  }
}


function showQuestion(){

  document
    .getElementById("display")
    .textContent = "❓";

  document
    .getElementById("question")
    .textContent =
    `Ada berapa ${askedItem.word}?`;

  createOptions();

  document
    .getElementById("answerArea")
    .classList.remove("hidden");
}


function createOptions(){

  let options = [askedItem.number];

  const otherNumbers =
    currentItems
      .filter(item => item.number !== askedItem.number)
      .map(item => item.number);

  options.push(...shuffle(otherNumbers).slice(0,3));

  options = shuffle(options);

  const container =
    document.getElementById("options");

  container.innerHTML = "";

  options.forEach(number => {

    const button =
      document.createElement("button");

    button.className = "option";

    button.textContent = number;

    button.onclick =
      () => checkAnswer(number);

    container.appendChild(button);

  });
}


function checkAnswer(value){

  const correct =
    value === askedItem.number;

  if(correct){
    score++;

    document
      .getElementById("message")
      .textContent =
      "Benar! 😎";

  }else{

    document
      .getElementById("message")
      .textContent =
      `Salah! Jawaban: ${askedItem.number}`;
  }

  document
    .getElementById("answerArea")
    .classList.add("hidden");

  setTimeout(
    nextRound,
    1200
  );
}

</script>

</body>
</html>
